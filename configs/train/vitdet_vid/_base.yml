_defaults:
  - "configs/models/vitdet_b_vid.yml"
sparsity: 0.3
margin: 0
period: 8
conf: 0.5
# _output: "results/train/vitdet_vid_baseline_lrsched_step/${_name}/"
_output: "results/train/vitdet_argoverse_baseline/${_name}.pth/"
output_weights: "results/train/vitdet_argoverse_baseline/weights_final.pth"
split: "vid_train"
vanilla: false
# weights: "results/train/vitdet_vid_baseline_lrsched_lr1e-5/base_672/weights_epoch_2.pth"
weights: "weights/vitdet_b_vid.pth"
optimizer: "AdamW"
optimizer_kwargs:
  lr: 1.0e-5
  weight_decay: 0.05
lr_scheduler_kwargs:
  min_lr: 1.0e-7
  warmup_epochs: 1
accum_iter: 8
dataloader_workers: 8
epochs: 5
mask: None
evaluate: False
head_training:
  head_epochs: 2
  freeze_modules: ["preprocessing", "embedding", "backbone"]
  partial_epochs: 1
  partial_backbone_blocks: [8, 9, 10, 11]
  partial_backbone_lr: 1.0e-5
  head_optimizer_kwargs:
    lr: 1.0e-4
    weight_decay: 0.05
  head_lr_scheduler_kwargs:
    min_lr: 1.0e-7
    warmup_epochs: 1
  partial_optimizer_kwargs:
    lr: 5.0e-5
    weight_decay: 0.05
  partial_lr_scheduler_kwargs:
    min_lr: 1.0e-7
    warmup_epochs: 1
  full_optimizer_kwargs:
    lr: 5.0e-5
    weight_decay: 0.05
  full_lr_scheduler_kwargs:
    min_lr: 1.0e-7
    warmup_epochs: 1
  full_backbone_lr: 5.0e-6
