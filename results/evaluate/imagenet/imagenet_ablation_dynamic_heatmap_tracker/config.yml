model:
  classes: 30
  detectron2_config: configs/detectron/vitdet_b_vid.py
  input_shape:
  - 3
  - 672
  - 672
  normalize_mean:
  - 123.675
  - 116.28
  - 103.53
  normalize_std:
  - 58.395
  - 57.12
  - 57.375
  output_channels: 256
  patch_size:
  - 16
  - 16
  scale_factors:
  - 4.0
  - 2.0
  - 1.0
  - 0.5
  backbone_config:
    backbone: windowed
    depth: 12
    position_encoding_size:
    - 14
    - 14
    window_indices:
    - 0
    - 1
    - 3
    - 4
    - 6
    - 7
    - 9
    - 10
    block_config:
      dim: 768
      relative_embedding_size:
      - 64
      - 64
      heads: 12
      mlp_ratio: 4
      window_size:
      - 14
      - 14
margin: 0
period: 8
conf: 0.5
sparsity: 1.0
keep_rate: 1.0
window_drop: false
_output: results/evaluate/imagenet/imagenet_ablation_dynamic_heatmap_tracker/
output_weights: results/train/vitdet_vid_combined_period_8_margin_0_conf_0.5/vitdet_b_vid_imagenet_ablation_dynamic_heatmap_tracker.pth
split: vid_train
vanilla: true
weights: weights/vitdet_b_vid.pth
evaluate: true
tracker:
  enabled: true
  track_activation_threshold: 0.5
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  frame_rate: 30
  minimum_consecutive_frames: 1
  input_score_threshold: 0.5
dynamic_mask:
  enabled: true
heatmap_mask:
  enabled: true
safety:
  enabled: true
  matching_iou_threshold: 0.5
  avg_iou_threshold: 0.8
  max_detection_miss_rate: 0.15
  max_track_miss_rate: 0.15
  speed_change_threshold: 5.0
dynamic_heatmap_window: 30
dynamic_heatmap_min_frames: 10
dynamic_heatmap_min_activity: 1.0
dynamic_heatmap_score_threshold: 0.75
region_size: 16
_name: imagenet_ablation_dynamic_heatmap_tracker
