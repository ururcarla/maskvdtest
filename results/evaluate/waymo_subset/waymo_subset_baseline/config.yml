model:
  classes: 3
  detectron2_config: configs/detectron/vitdet_b_vid.py
  input_shape:
  - 3
  - 1024
  - 1024
  normalize_mean:
  - 123.675
  - 116.28
  - 103.53
  normalize_std:
  - 58.395
  - 57.12
  - 57.375
  output_channels: 256
  patch_size:
  - 16
  - 16
  scale_factors:
  - 4.0
  - 2.0
  - 1.0
  - 0.5
  backbone_config:
    backbone: windowed
    depth: 12
    position_encoding_size:
    - 14
    - 14
    window_indices:
    - 0
    - 1
    - 3
    - 4
    - 6
    - 7
    - 9
    - 10
    block_config:
      dim: 768
      relative_embedding_size:
      - 64
      - 64
      heads: 12
      mlp_ratio: 4
      window_size:
      - 14
      - 14
_output: results/evaluate/waymo_subset/waymo_subset_baseline/
split: val
vanilla: true
weights: results/train/vitdet_waymo_2/weights_final.pth
dataset:
  name: waymo
  split: val
  args:
    waymo:
      img_root:
        val: ./data/waymo/val/frames
      ann_files:
        val: ./data/waymo_subset/val/annotations/instances_val.json
_name: waymo_subset_baseline
