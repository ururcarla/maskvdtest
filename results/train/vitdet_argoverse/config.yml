model:
  classes: 8
  detectron2_config: configs/detectron/vitdet_b_vid.py
  input_shape:
  - 3
  - 672
  - 672
  normalize_mean:
  - 123.675
  - 116.28
  - 103.53
  normalize_std:
  - 58.395
  - 57.12
  - 57.375
  output_channels: 256
  patch_size:
  - 16
  - 16
  scale_factors:
  - 4.0
  - 2.0
  - 1.0
  - 0.5
  backbone_config:
    backbone: windowed
    depth: 12
    position_encoding_size:
    - 14
    - 14
    window_indices:
    - 0
    - 1
    - 3
    - 4
    - 6
    - 7
    - 9
    - 10
    block_config:
      dim: 768
      relative_embedding_size:
      - 64
      - 64
      heads: 12
      mlp_ratio: 4
      window_size:
      - 14
      - 14
sparsity: 0.3
margin: 0
period: 8
conf: 0.5
split: vid_train
vanilla: false
mask: None
evaluate: false
_output: results/train/vitdet_argoverse/
output_weights: results/train/vitdet_argoverse/weights_final.pth
weights: weights/vitdet_b_vid.pth
optimizer: AdamW
optimizer_kwargs:
  lr: 2.0e-05
  weight_decay: 0.05
lr_scheduler_kwargs:
  min_lr: 1.0e-07
  warmup_epochs: 1
epochs: 8
accum_iter: 8
dataloader_workers: 4
head_training:
  enabled: false
  head_modules:
  - pyramid
  - proposal_generator
  - roi_heads
  freeze_modules:
  - preprocessing
  - embedding
  - backbone
  stages:
  - name: head
    description: 仅训练检测头
    epochs: 5
    train_head: true
    train_backbone: false
    optimizer:
      lr: 0.0001
      weight_decay: 0.05
    backbone:
      lr: 0.0001
      weight_decay: 0.05
    lr_scheduler:
      min_lr: 1.0e-07
      warmup_epochs: 2
  - name: partial
    description: （可选）只解冻指定 backbone blocks
    epochs: 4
    train_head: true
    train_backbone: true
    backbone_blocks:
    - 8
    - 9
    - 10
    - 11
    optimizer:
      lr: 1.0e-05
      weight_decay: 0.05
    backbone:
      lr: 1.0e-05
      weight_decay: 0.05
    lr_scheduler:
      min_lr: 1.0e-07
      warmup_epochs: 2
  - name: full
    description: 解冻全骨干并继续微调
    epochs: 3
    train_head: true
    train_backbone: true
    backbone_blocks: all
    optimizer:
      lr: 5.0e-06
      weight_decay: 0.05
    backbone:
      lr: 5.0e-06
      weight_decay: 0.05
    lr_scheduler:
      min_lr: 1.0e-07
      warmup_epochs: 1
layerwise_lr_decay:
  enabled: true
  layer_decay: 0.75
  no_weight_decay_list:
  - position_encoding.encoding
  - position_encoding.encoding
  - blocks.0.relative_position.y_embedding
  - blocks.0.relative_position.x_embedding
  - blocks.1.relative_position.y_embedding
  - blocks.1.relative_position.x_embedding
  - blocks.2.relative_position.y_embedding
  - blocks.2.relative_position.x_embedding
  - blocks.3.relative_position.y_embedding
  - blocks.3.relative_position.x_embedding
  - blocks.4.relative_position.y_embedding
  - blocks.4.relative_position.x_embedding
  - blocks.5.relative_position.y_embedding
  - blocks.5.relative_position.x_embedding
  - blocks.6.relative_position.y_embedding
  - blocks.6.relative_position.x_embedding
  - blocks.7.relative_position.y_embedding
  - blocks.7.relative_position.x_embedding
  - blocks.8.relative_position.y_embedding
  - blocks.8.relative_position.x_embedding
  - blocks.9.relative_position.y_embedding
  - blocks.9.relative_position.x_embedding
  - blocks.10.relative_position.y_embedding
  - blocks.10.relative_position.x_embedding
  - blocks.11.relative_position.y_embedding
  - blocks.11.relative_position.x_embedding
dataset:
  name: argoverse
  train_split: train
  val_split: val
  args:
    argoverse:
      img_root: ./data/argoverse/Argoverse-1.1/tracking
      ann_files:
        train: ./data/argoverse/Argoverse-HD/annotations/train.json
        val: ./data/argoverse/Argoverse-HD/annotations/val.json
_name: base_672_argoverse_layerwise
